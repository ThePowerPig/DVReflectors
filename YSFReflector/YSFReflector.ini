[General]
Daemon=1

[Info]
# Remember to register your YSFReflector at:
# https://register.ysfreflector.de
# Id=5 digits only
Name=16 characters max
Description=14 characters max

[Log]
# Logging levels, 0=No logging
DisplayLevel=1
FileLevel=1
FilePath=.
FileRoot=YSFReflector
FileRotate=1

[Network]
Port=42000
Debug=0

[Block List]
File=BlockList.txt
Time=5

# Direct link to one HBlink3/FreeDMR OpenBridge peer. Enable=0 keeps the
# reflector YSF-only. See OPENBRIDGE.md for a worked HBlink example.
[OpenBridge]
Enable=0
Address=127.0.0.1
Port=62035
LocalPort=62036
NetworkId=310999
Passphrase=changeme
Talkgroup=9999
IdFile=DMRIds.dat
FallbackId=0
ColorCode=1
Callsign=
Debug=0
