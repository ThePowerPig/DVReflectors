[General]
Daemon=1

[Id Lookup]
Name=DMRIds.dat
Time=24

[Log]
# Logging levels, 0=No logging
DisplayLevel=1
FileLevel=1
FilePath=.
FileRoot=P25Reflector
FileRotate=1

[Network]
Port=41000
Debug=0

[OpenBridge]
# OpenBridge Protocol (DMRD) link to an OBP server (HBlink3/HBlink4 OPENBRIDGE
# systems, MMDVM_Bridge peers).  Passphrase MUST be quoted (a # inside the
# value starts a comment otherwise).  Enabled=0 keeps the link off.
Enabled=0
Address=127.0.0.1
PeerPort=62031
Port=42000
Passphrase="secret"
ID=999999
Callsign="P25RPT"
Debug=0

[Vocoder]
# Voice conversion engine.  Builtin=1 (default) uses the compiled-in
# mbelib-neo codec (AMBE+2 2450 + IMBE 7200x4400) — no external process.
# Builtin=0 talks UDP to an external vocoder (md380tools emulator protocol +
# IMBE extension) at Address/AmbePort/ImbePort.  With Enabled=0 OBP streams
# are tracked/logged but voice is not bridged.
Enabled=0
Builtin=1
Address=127.0.0.1
AmbePort=43000
ImbePort=43001
