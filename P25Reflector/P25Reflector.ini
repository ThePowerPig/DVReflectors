[General]
Daemon=1

[Id Lookup]
Name=DMRIds.dat
Time=24

[Log]
# Logging levels, 0=No logging
DisplayLevel=1
FileLevel=1
FilePath=.
FileRoot=P25Reflector
FileRotate=1

[Network]
Port=41000
Debug=0

[OpenBridge]
# OpenBridge Protocol (DMRD) link to an OBP server (HBlink3/HBlink4 OPENBRIDGE
# systems, MMDVM_Bridge peers).  Passphrase MUST be quoted (a # inside the
# value starts a comment otherwise).  Enabled=0 keeps the link off.
Enabled=0
Address=127.0.0.1
PeerPort=62031
Port=42000
Passphrase="secret"
ID=999999
Callsign="P25RPT"
Debug=0

[Vocoder]
# External AMBE/IMBE vocoder (md380tools emulator protocol + VocoderEmu IMBE
# extension).  With Enabled=0 OBP streams are tracked/logged but voice is not
# bridged (no codec engine).
Enabled=0
Address=127.0.0.1
AmbePort=43000
ImbePort=43001
